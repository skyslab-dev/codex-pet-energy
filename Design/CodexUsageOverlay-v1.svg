<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
  <defs>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173F8F"/>
      <stop offset=".43" stop-color="#5D78EA"/>
      <stop offset="1" stop-color="#F6A45F"/>
    </linearGradient>
    <radialGradient id="blueOrb" cx=".3" cy=".3" r=".75">
      <stop offset="0" stop-color="#83E7FF"/>
      <stop offset="1" stop-color="#1473FF" stop-opacity=".12"/>
    </radialGradient>
    <radialGradient id="peachOrb" cx=".35" cy=".3" r=".78">
      <stop offset="0" stop-color="#FFE1BB"/>
      <stop offset="1" stop-color="#FF7B72" stop-opacity=".15"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".64"/>
      <stop offset=".55" stop-color="#F4F6FC" stop-opacity=".49"/>
      <stop offset="1" stop-color="#E8EEFA" stop-opacity=".43"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".88"/>
