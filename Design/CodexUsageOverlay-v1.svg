      <stop offset="1" stop-color="#17294E" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="topWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".52" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="glassClip">
      <rect x="148" y="88" width="424" height="324" rx="52"/>
    </clipPath>
    <filter id="backdropBlur" x="-20%" y="-20%" width="140%" height="140%">
