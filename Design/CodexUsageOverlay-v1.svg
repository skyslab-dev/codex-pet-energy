      <feColorMatrix type="saturate" values="1.18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-35%" width="160%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dy="12"/>
      <feColorMatrix values="0 0 0 0 0.02  0 0 0 0 0.05  0 0 0 0 0.14  0 0 0 .30 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="wallpaperArt">
