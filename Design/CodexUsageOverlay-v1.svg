      <circle cx="648" cy="70" r="198" fill="url(#peachOrb)" opacity=".95"/>
      <path d="M-68 174C104 40 221 40 347 133s254 77 444-81" fill="none" stroke="#D7E7FF" stroke-width="88" stroke-linecap="round" opacity=".18"/>
      <path d="M-82 451c154-100 303-91 429 3s257 82 466-35" fill="none" stroke="#FFE4BF" stroke-width="92" stroke-linecap="round" opacity=".17"/>
    </g>
  </defs>

  <rect width="720" height="520" fill="url(#wallpaper)"/>
